name: Build & Push Docker image (Seven Bridges)

on:
  push:
    branches: ["docker-dev", "docker-push-7bridges"]
    tags: ["bdc-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: dm-bip-env

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and normalize registry settings
        id: registry-config
        shell: bash
        run: |
          registry='${{ vars.SB_REGISTRY }}'
          username='${{ vars.SB_REGISTRY_USERNAME }}'

          if [[ -z "$registry" ]]; then
            echo "SB_REGISTRY is empty. Set repository variable SB_REGISTRY." >&2
            exit 1
          fi

          if [[ -z "$username" ]]; then
            echo "SB_REGISTRY_USERNAME is empty. Set repository variable SB_REGISTRY_USERNAME." >&2
            exit 1
          fi

          # Normalize common input mistakes: protocol prefix, trailing slash, and /v2 suffix.
          registry="${registry#http://}"
          registry="${registry#https://}"
          registry="${registry%/}"
          registry="${registry%/v2}"

          if [[ "$registry" == */* ]]; then
            echo "SB_REGISTRY must be host only (example: images.sb.biodatacatalyst.nhlbi.nih.gov)." >&2
            echo "Current normalized value: $registry" >&2
            exit 1
          fi

          if [[ -z "${{ secrets.SB_REGISTRY_PASSWORD }}" ]]; then
            echo "SB_REGISTRY_PASSWORD is empty. Set repository secret SB_REGISTRY_PASSWORD." >&2
            exit 1
          fi

          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "username=$username" >> "$GITHUB_OUTPUT"
          echo "✓ Using registry host: $registry"
          echo "✓ Using registry username: $username"
          echo "✓ Registry length: ${#registry}"
          echo "✓ Username length: ${#username}"
          echo "✓ Password is set: $([ -z '${{ secrets.SB_REGISTRY_PASSWORD }}' ] && echo 'NO' || echo 'YES')"

      - name: Set up QEMU (optional, for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Seven Bridges registry
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.registry-config.outputs.registry }}
          username: ${{ steps.registry-config.outputs.username }}
          password: ${{ secrets.SB_REGISTRY_PASSWORD }}

      # Deployment tier is selected here, and ONLY here. This is the single
      # branch/tag -> Seven Bridges image repository mapping in the repo:
      #   docker-dev branch      -> SB_REGISTRY_PROJECT_DEV     (dm-bip-docker-dev)
      #   bdc-v* tag             -> SB_REGISTRY_PROJECT_PROD    (dm-bip-prod)
      #   anything else (test)   -> SB_REGISTRY_PROJECT_DEVELOP (dm-bip-develop)
      #
      # One repository per tier: no two triggers write the same :latest. The
      # else-arm also catches workflow_dispatch from an arbitrary branch, which
      # would otherwise have no tier, so it must stay a catch-all rather than an
      # explicit docker-push-7bridges match.
      - name: Configure build for branch
        id: build-config
        run: |
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == "refs/heads/docker-dev" ]]; then
            tier="dev"
            pull_latest="true"
            project='${{ vars.SB_REGISTRY_PROJECT_DEV }}'
            project_var="SB_REGISTRY_PROJECT_DEV"
          elif [[ "${{ github.ref }}" == refs/tags/bdc-v* ]]; then
            tier="prod"
            pull_latest="false"
            project='${{ vars.SB_REGISTRY_PROJECT_PROD }}'
            project_var="SB_REGISTRY_PROJECT_PROD"
          else
            tier="test"
            pull_latest="false"
            project='${{ vars.SB_REGISTRY_PROJECT_DEVELOP }}'
            project_var="SB_REGISTRY_PROJECT_DEVELOP"
          fi

          # Fail loudly rather than pushing to a malformed path with an empty segment.
          if [[ -z "$project" ]]; then
            echo "$project_var is empty. Set repository variable $project_var (see RELEASING.md)." >&2
            exit 1
          fi

          echo "pull_latest=$pull_latest" >> "$GITHUB_OUTPUT"
          echo "registry_project=$project" >> "$GITHUB_OUTPUT"
          echo "OK Tier: $tier ($project_var = $project), BDC_PULL_LATEST=$pull_latest"

      - name: Build, tag, and push image
        run: |
          # Full image path. Every segment is resolved from GitHub Actions config --
          # nothing about the push target is hard-coded in this workflow:
          #   registry        <- vars.SB_REGISTRY
          #   namespace       <- vars.SB_REGISTRY_USERNAME
          #   registry_project <- branch/tag, see "Configure build for branch" above
          #   IMAGE_NAME      <- env.IMAGE_NAME
          IMAGE_URI=${{ steps.registry-config.outputs.registry }}/${{ steps.registry-config.outputs.username }}/${{ steps.build-config.outputs.registry_project }}/$IMAGE_NAME

          # Immutable, traceable tag (12-char commit SHA) pushed alongside :latest.
          SHA_TAG="sha-${GITHUB_SHA::12}"
          # On a bdc-v* release tag push, also publish that version tag.
          VERSION_TAG=""
          if [[ "${GITHUB_REF}" == refs/tags/bdc-v* ]]; then
            VERSION_TAG="${GITHUB_REF_NAME}"
          fi

          # Pass build metadata so the image LABELs / provenance are populated
          # (previously supplied by docker/metadata-action).
          docker build \
            --build-arg BDC_PULL_LATEST=${{ steps.build-config.outputs.pull_latest }} \
            --build-arg DM_BIP_VERSION=${{ github.ref_name }} \
            --build-arg DM_BIP_GIT_REF=${{ github.sha }} \
            --build-arg DM_BIP_BUILD_DATE=${{ steps.build-config.outputs.build_date }} \
            -t $IMAGE_NAME .

          docker tag $IMAGE_NAME $IMAGE_URI:latest
          docker tag $IMAGE_NAME "$IMAGE_URI:$SHA_TAG"
          docker push $IMAGE_URI:latest
          docker push "$IMAGE_URI:$SHA_TAG"

          if [[ -n "$VERSION_TAG" ]]; then
            docker tag $IMAGE_NAME "$IMAGE_URI:$VERSION_TAG"
            docker push "$IMAGE_URI:$VERSION_TAG"
          fi
